name: Godot 4.7 checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7 Standard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --max-time 180 \
            'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7' \
            -o "$RUNNER_TEMP/godot/engine.zip"
          unzip -q "$RUNNER_TEMP/godot/engine.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import and check scripts
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7-stable_linux.x86_64 --version
          timeout 120s Godot_v4.7-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' import.log; then exit 1; fi
      - name: Gameplay regression checks
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . -- --self-test 2>&1 | tee test.log
          grep -q 'SELF TEST PASS:' test.log
      - name: Pixel animation and save repair regression checks
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_pixel_actor.gd 2>&1 | tee pixel-test.log
          grep -q 'PIXEL ACTOR PASS:' pixel-test.log
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_action_events.gd 2>&1 | tee action-test.log
          grep -q 'ACTION EVENTS PASS:' action-test.log
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_combat_feedback.gd 2>&1 | tee feedback-test.log
          grep -q 'COMBAT FEEDBACK PASS:' feedback-test.log
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_ui.gd 2>&1 | tee ui-test.log
          grep -q 'UI PASS:' ui-test.log
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_save_repair.gd 2>&1 | tee save-test.log
          grep -q 'SAVE REPAIR PASS:' save-test.log
      - name: 3D boar study kinematics and exported sheet
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://experiments/boar3d/test_kinematics.gd 2>&1 | tee boar3d-test.log
          grep -q '3D STUDY PASS:' boar3d-test.log
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: game with spaces
      - name: Run the actual Windows launcher with a spaced path
        shell: cmd
        run: call "game with spaces\play.bat" --check-only
      - name: Verify repeat launch without downloading again
        shell: cmd
        run: call "game with spaces\play.bat" --check-only
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-launcher-logs
          path: game with spaces/.tools/*.log
