name: Godot 4.7 checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check durable project handoff
        env:
          HANDOFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/check_handoff.py --base "$HANDOFF_BASE"
      - name: Install Godot 4.7 Standard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --max-time 180 \
            'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7' \
            -o "$RUNNER_TEMP/godot/engine.zip"
          unzip -q "$RUNNER_TEMP/godot/engine.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import and check scripts
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7-stable_linux.x86_64 --version
          timeout 120s Godot_v4.7-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' import.log; then exit 1; fi
      - name: Gameplay regression checks
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . -- --self-test 2>&1 | tee test.log
          grep -q 'SELF TEST PASS:' test.log
      - name: Pixel animation and save repair regression checks
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_pixel_actor.gd 2>&1 | tee pixel-test.log
          grep -q 'PIXEL ACTOR PASS:' pixel-test.log
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_action_events.gd 2>&1 | tee action-test.log
          grep -q 'ACTION EVENTS PASS:' action-test.log
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_combat_feedback.gd 2>&1 | tee feedback-test.log
          grep -q 'COMBAT FEEDBACK PASS:' feedback-test.log
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_ui.gd 2>&1 | tee ui-test.log
          grep -q 'UI PASS:' ui-test.log
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_art_type.gd 2>&1 | tee art-type-test.log
          grep -q 'ART TYPE PASS:' art-type-test.log
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_save_repair.gd 2>&1 | tee save-test.log
          grep -q 'SAVE REPAIR PASS:' save-test.log
      - name: 3D boar study kinematics and exported sheet
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://experiments/boar3d/test_kinematics.gd 2>&1 | tee boar3d-test.log
          grep -q '3D STUDY PASS:' boar3d-test.log
      - name: Campaign progression and taming compatibility
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_campaign.gd 2>&1 | tee campaign-test.log
          grep -q 'CAMPAIGN PASS:' campaign-test.log
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_mixed_stages.gd 2>&1 | tee mixed-test.log
          grep -q 'MIXED STAGES PASS:' mixed-test.log
      - name: Companion synthesis progression and preview
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_synthesis_progression.gd 2>&1 | tee synthesis-progression.log
          grep -q 'SYNTHESIS PROGRESSION PASS:' synthesis-progression.log
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_synthesis_preview.gd 2>&1 | tee synthesis-preview.log
          grep -q 'SYNTHESIS PREVIEW PASS:' synthesis-preview.log
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_special_synthesis.gd 2>&1 | tee special-synthesis.log
          grep -q 'SPECIAL SYNTHESIS PASS:' special-synthesis.log
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_special_combat.gd 2>&1 | tee special-combat.log
          grep -q 'SPECIAL COMBAT PASS:' special-combat.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' synthesis-progression.log synthesis-preview.log special-synthesis.log special-combat.log; then exit 1; fi
      - name: Map progression and eight-stage valley
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_campaign_routes.gd 2>&1 | tee campaign-routes.log
          grep -q 'CAMPAIGN ROUTES PASS:' campaign-routes.log
          timeout 90s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/audit_valley_routes.gd 2>&1 | tee valley-journey.log
          grep -q 'VALLEY JOURNEY PASS 48/48' valley-journey.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' campaign-routes.log valley-journey.log; then exit 1; fi
      - name: Quarry stages and continuous valley-to-quarry growth
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_quarry_routes.gd 2>&1 | tee quarry-routes.log
          grep -q 'QUARRY ROUTES PASS:' quarry-routes.log
          timeout 90s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/audit_valley_routes.gd -- --through-quarry 2>&1 | tee quarry-journey.log
          grep -q 'QUARRY JOURNEY PASS 96/96' quarry-journey.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' quarry-routes.log quarry-journey.log; then exit 1; fi
      - name: Companion evolution transaction and combat
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_evolution.gd 2>&1 | tee evolution.log
          grep -q 'EVOLUTION PASS:' evolution.log
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_evolution_combat.gd 2>&1 | tee evolution-combat.log
          grep -q 'EVOLUTION COMBAT PASS:' evolution-combat.log
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_evolution_six.gd 2>&1 | tee evolution-six.log
          grep -q 'EVOLUTION SIX PASS:' evolution-six.log
          timeout 60s Godot_v4.7-stable_linux.x86_64 --headless --path . --script res://tools/test_evolution_six_combat.gd 2>&1 | tee evolution-six-combat.log
          grep -q 'EVOLUTION SIX COMBAT PASS:' evolution-six-combat.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' evolution.log evolution-combat.log evolution-six.log evolution-six-combat.log; then exit 1; fi
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: game with spaces
      - name: Run the actual Windows launcher with a spaced path
        shell: cmd
        run: call "game with spaces\play.bat" --check-only
      - name: Verify repeat launch without downloading again
        shell: cmd
        run: call "game with spaces\play.bat" --check-only
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-launcher-logs
          path: game with spaces/.tools/*.log
